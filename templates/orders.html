{% extends "base.html" %}{% block content %}
<h2>My Orders</h2>
{% for o in orders %}<a class="card" href="/order/{{ o.id }}" style="margin-bottom:10px">
 <b>#{{ o.id }} · {{ o.restaurant.name }}</b> <span class="muted">— ₹{{ o.total }} · {{ o.status }}</span></a>
{% else %}<p>Abhi tak koi order nahi.</p>{% endfor %}{% endblock %}
